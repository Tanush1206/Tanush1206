name: Waka Readme

on:
  workflow_dispatch:

  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: write

jobs:
  update-readme:
    name: Update WakaTime Stats
    runs-on: ubuntu-latest

    steps:
      - uses: athul/waka-readme@master
        with:
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}

          SHOW_TITLE: true
          SECTION_NAME: waka

          BLOCKS: ⣀⣄⣤⣦⣶⣷⣿
          CODE_LANG: text

          TIME_RANGE: last_7_days
          LANG_COUNT: 8

          SHOW_TIME: true
          SHOW_TOTAL: true

          STOP_AT_OTHER: false
          IGNORED_LANGUAGES: YAML JSON TOML
